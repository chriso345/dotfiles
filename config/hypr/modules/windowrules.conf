windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 0
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
    name = caucus-floating
    match:title = ^caucus$
    float = 1
    center = 1
    size = 800 600
}
